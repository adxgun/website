text = "I'm comfortable starting from a vague brief. I break it down, make the trade-offs visible and get to a plan the team believes in."

[[params.strengths]]
title = "Working across functions"
text = "I translate between engineering and the business, whether that's compliance, operations, product or finance, so everyone understands what we're building and why."

[[params.strengths]]
title = "Judgement under pressure"
text = "I think about how things fail before they do, and I stay steady and methodical when they do."

[[params.strengths]]
title = "Leading and lifting others"
text = "I've led small teams through delivery, I write things down so others can move without me, and I enjoy helping people grow."

contact = """
I enjoy working with small, ambitious teams on hard backend and platform problems. If you're building something interesting, I'd love to hear about it.
"""

