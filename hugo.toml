[params]
description = "Hammed Adigun — Senior Software Engineer in London building payments, credit and ledger systems, developer platforms and applied AI."
role = "Senior Software Engineer"
location = "Senior Software Engineer · London, UK"
singleDateFormat = '2 Jan 2006'

headline = "I build <em>money-critical</em> backends and the platforms they run on."
intro = """
Backend and distributed systems engineer working across payments, credit and ledgers, developer platforms, and LLM-powered workflows. Founding-engineer energy, production-grade habits.
"""
focus = ["Distributed systems", "Payments & ledgers", "Platform engineering", "Applied AI"]

aboutTitle = "Building systems where correctness matters"
about = """
I'm Hammed, a software engineer in London with years of experience in fintech, building well-known products used by millions of people and automating workflows with AI. I've built credit card systems, a credit monitoring product that people use to keep an eye on their credit health, infrastructure for deploying web applications, and CRM tools. I've done this in both large organisations and startups.

I build high-performance software end to end and I'm very proficient with AI tools. What I enjoy most is working out what actually needs to be built, getting the right people aligned on it, and owning it until it works in production.

I'm calm when things go wrong, and I write things down. I care about clear API contracts, honest status updates and design docs other people can pick up without me. I've led small teams by setting direction and unblocking people, not by handing out tickets.

Outside work, I hack on open-source projects. [sarabi](https://github.com/adxgun/sarabi) is a deployment tool that hosts this site, and [registry-auth](https://github.com/adxgun/registry-auth), a token authentication server for Docker registries, is used in production by [Apptainer](https://apptainer.org). I also practise data structures and algorithms in my spare time to keep my fundamentals sharp.
"""

